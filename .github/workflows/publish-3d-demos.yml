name: Publish 3D demos to GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "template 3D/Dioramas/**"
      - ".github/workflows/publish-3d-demos.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-3d-demos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "template 3D/Dioramas/package-lock.json"
      - name: Install dependencies
        working-directory: "template 3D/Dioramas"
        run: npm ci
      - name: Build gallery for GitHub Pages
        working-directory: "template 3D/Dioramas"
        run: npm run build -- --base=/varese-sites/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "template 3D/Dioramas/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
