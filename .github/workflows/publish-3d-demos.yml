name: Publish main site to GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "sites/**"
      - ".github/workflows/publish-3d-demos.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble main site only
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='template 3D' --exclude='node_modules' --exclude='_site' ./ _site/
          rm -rf _site/3d-demo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload main site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
