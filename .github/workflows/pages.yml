name: Deploy standalone relationship test

on:
  push:
    branches: ["main"]
    paths:
      - "test-relazioni.html"
      - ".github/workflows/pages.yml"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare only the test
        run: |
          mkdir -p _site
          cp test-relazioni.html _site/index.html
          touch _site/.nojekyll

      - name: Upload test only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
