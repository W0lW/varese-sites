name: Deploy static sites to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "template 3D/Dioramas/package-lock.json"

      - name: Install 3D templates dependencies
        working-directory: "template 3D/Dioramas"
        run: npm ci

      - name: Build all 3D demos
        working-directory: "template 3D/Dioramas"
        run: npm run build -- --base="/varese-sites/Template%203D/"

      - name: Generate business pages using matched 3D concepts
        run: node scripts/apply-3d-business-templates.mjs

      - name: Audit generated pages for demo residue and structural defects
        run: node scripts/audit-generated-pages.mjs

      - name: Assemble complete site and Template 3D collection
        run: |
          test -f index.html
          test -f shared/site.css
          test -f shared/site.js
          test -f sites/index.html
          count=$(find sites -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)
          echo "Business concept pages: $count"
          test "$count" -ge 80
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='template 3D' --exclude='Template 3D' --exclude='node_modules' --exclude='_site' ./ _site/
          mkdir -p "_site/Template 3D"
          cp -a "template 3D/Dioramas/dist/." "_site/Template 3D/"
          test -f "_site/Template 3D/index.html"
          test -f "_site/Template 3D/examples/reliquary/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
