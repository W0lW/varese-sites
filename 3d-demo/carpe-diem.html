<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a0f08"><title>Carpe Diem — 3D Demo</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a0f08;color:#f5e6d3;font-family:Georgia,serif}canvas{position:fixed;inset:0;display:block;width:100%;height:100%}.overlay{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,5vw,56px)}.top{display:flex;justify-content:space-between;gap:20px}.brand{font-size:13px;letter-spacing:.42em;text-transform:uppercase;font-style:italic}.contact{font:10px/2 Arial,sans-serif;letter-spacing:.18em;text-align:right;color:#b18c68}.bottom h1{font-size:clamp(48px,8.2vw,112px);font-weight:400;font-style:italic;letter-spacing:-.055em;line-height:.87;margin:0}.bottom h1 span{color:#d4a574}.bottom p{margin:24px 0 0;font:10px/1.8 Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#b08b67}.back{position:fixed;bottom:22px;right:clamp(24px,5vw,56px);z-index:4;color:#a08060;text-decoration:none;font:10px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase}@media(max-width:520px){.bottom p{max-width:240px}.contact{font-size:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div class="overlay"><div class="top"><div class="brand">Carpe Diem</div><div class="contact">Via Severo Piatti 9<br>Varese</div></div><div class="bottom"><h1>Ogni capello<br><span>racconta.</span></h1><p>Parrucchieri · Varese</p></div></div><a class="back" href="./">← Tutte le 3D demo</a>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a0f08);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.z=6;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const group=new THREE.Group();scene.add(group);const strands=[];const N=92,P=20;
for(let i=0;i<N;i++){const baseX=(Math.random()-.5)*8,length=4+Math.random()*3,phase=Math.random()*Math.PI*2,speed=.3+Math.random()*.5,hue=.065+Math.random()*.07,light=.45+Math.random()*.28;const material=new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(hue,.58,light),transparent:true,opacity:.68+Math.random()*.3});const positions=new Float32Array(P*3);const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));const line=new THREE.Line(geometry,material);group.add(line);strands.push({line,baseX,length,phase,speed,positions})}
const mouse={x:0,y:0,tx:0,ty:0};function point(x,y){mouse.tx=x/innerWidth*2-1;mouse.ty=-(y/innerHeight)*2+1}addEventListener('pointermove',e=>point(e.clientX,e.clientY),{passive:true});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);if(document.hidden)return;const t=clock.getElapsedTime();mouse.x+=(mouse.tx-mouse.x)*.06;mouse.y+=(mouse.ty-mouse.y)*.06;for(const s of strands){for(let j=0;j<P;j++){const u=j/(P-1),wave=Math.sin(t*s.speed+s.phase+u*3)*.3*u,windX=mouse.x*1.2*u*u,windY=mouse.y*.6*u*u,k=j*3;s.positions[k]=s.baseX+wave+windX;s.positions[k+1]=-3+u*s.length+windY;s.positions[k+2]=Math.sin(t*.5+s.phase)*.15} s.line.geometry.attributes.position.needsUpdate=true}group.rotation.z=Math.sin(t*.12)*.025;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});addEventListener('pagehide',()=>{for(const s of strands){s.line.geometry.dispose();s.line.material.dispose()}renderer.dispose()});
</script></body></html>
