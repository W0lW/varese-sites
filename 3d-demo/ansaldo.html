<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Carrozzeria Ansaldo — 3D Demo</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#e8e8e8;font-family:Arial,Helvetica,sans-serif}canvas{position:fixed;inset:0;display:block;width:100%;height:100%}.overlay{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(22px,4vw,48px);z-index:2}.top{display:flex;justify-content:space-between;gap:20px}.logo{font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:#fff}.info{text-align:right;font-size:10px;letter-spacing:.18em;line-height:1.9;color:#8c929a}.bottom h1{font-size:clamp(42px,7.3vw,100px);font-weight:300;letter-spacing:-.055em;line-height:.91;margin:0;color:#fff}.bottom h1 span{color:#c0c8d0;font-family:Georgia,serif;font-style:italic}.bottom p{margin:22px 0 0;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#858b93}.hint{position:fixed;bottom:22px;right:clamp(22px,4vw,48px);z-index:3;font-size:9px;letter-spacing:.2em;color:#6c737b;text-transform:uppercase}.back{position:fixed;bottom:22px;left:clamp(22px,4vw,48px);z-index:4;color:#9ca3ab;font-size:10px;letter-spacing:.15em;text-decoration:none;text-transform:uppercase}@media(max-width:520px){.info{font-size:9px}.bottom p{max-width:240px;line-height:1.8}.hint{bottom:52px;left:22px;right:auto}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050505);scene.fog=new THREE.Fog(0x050505,5,15);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,0,4.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
const geo=new THREE.IcosahedronGeometry(1.5,5);const base=geo.attributes.position.array.slice();
const mat=new THREE.MeshStandardMaterial({color:0xb8bcc4,metalness:.95,roughness:.17,envMapIntensity:1.5});
const mesh=new THREE.Mesh(geo,mat);scene.add(mesh);
scene.add(new THREE.AmbientLight(0x202830,1.4));const l1=new THREE.DirectionalLight(0xffffff,4);l1.position.set(5,5,5);scene.add(l1);const l2=new THREE.DirectionalLight(0x88ccff,3);l2.position.set(-5,-3,2);scene.add(l2);const l3=new THREE.DirectionalLight(0xffaa66,2);l3.position.set(0,-5,-3);scene.add(l3);
const envScene=new THREE.Scene();envScene.background=new THREE.Color(0x0a0f18);for(const [y,color] of [[3,0x88aaff],[-3,0xffaa66]]){const strip=new THREE.Mesh(new THREE.PlaneGeometry(10,1),new THREE.MeshBasicMaterial({color}));strip.position.set(0,y,-5);envScene.add(strip)}const cubeRT=new THREE.WebGLCubeRenderTarget(128);const cubeCam=new THREE.CubeCamera(.1,100,cubeRT);cubeCam.update(renderer,envScene);mat.envMap=cubeRT.texture;mat.needsUpdate=true;
const mouse={x:0,y:0,tx:0,ty:0};function pointer(x,y){mouse.tx=x/innerWidth*2-1;mouse.ty=-(y/innerHeight)*2+1}addEventListener('pointermove',e=>pointer(e.clientX,e.clientY),{passive:true});
const clock=new THREE.Clock();let frame=0;function animate(){requestAnimationFrame(animate);if(document.hidden)return;const t=clock.getElapsedTime();mouse.x+=(mouse.tx-mouse.x)*.05;mouse.y+=(mouse.ty-mouse.y)*.05;const pos=geo.attributes.position;const intensity=.08+Math.hypot(mouse.x,mouse.y)*.22;for(let i=0;i<pos.count;i++){const k=i*3,x=base[k],y=base[k+1],z=base[k+2];const n=Math.sin(x*2.5+t*.8+mouse.x*3)*Math.cos(y*2.5+t*.6+mouse.y*3)*Math.sin(z*2.5+t*.7);const s=1+n*intensity;pos.setXYZ(i,x*s,y*s,z*s)}pos.needsUpdate=true;geo.computeVertexNormals();mesh.rotation.y=t*.15+mouse.x*.4;mesh.rotation.x=mouse.y*.3;renderer.render(scene,camera);frame++}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});
addEventListener('pagehide',()=>{geo.dispose();mat.dispose();cubeRT.dispose();renderer.dispose()});
</script></body></html>
