<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f6f8);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.z=8;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const COLS=100,ROWS=64,count=COLS*ROWS,positions=new Float32Array(count*3),base=new Float32Array(count*3),alpha=new Float32Array(count);let idx=0;
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=(c/(COLS-1)-.5)*14,y=(r/(ROWS-1)-.5)*9,k=idx*3;positions[k]=base[k]=x;positions[k+1]=base[k+1]=y;positions[k+2]=base[k+2]=0;alpha[idx]=.45+Math.random()*.5;idx++}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));geo.setAttribute('alpha',new THREE.BufferAttribute(alpha,1));
const mat=new THREE.ShaderMaterial({uniforms:{uColorClean:{value:new THREE.Color(0x2a7acc)},uColorDirty:{value:new THREE.Color(0x8a95a0)}},vertexShader:'attribute float alpha; varying float vAlpha; void main(){vAlpha=alpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=clamp((1.0+alpha*3.0)*(230.0/-mv.z),1.0,7.0);gl_Position=projectionMatrix*mv;}',fragmentShader:'uniform vec3 uColorClean;uniform vec3 uColorDirty;varying float vAlpha;void main(){vec2 uv=gl_PointCoord-.5;float d=length(uv);if(d>.5)discard;vec3 col=mix(uColorDirty,uColorClean,1.0-vAlpha);gl_FragColor=vec4(col,.25+vAlpha*.6);}',transparent:true,depthWrite:false});
scene.add(new THREE.Points(geo,mat));const mouse={x:100,y:100};addEventListener('pointermove',e=>{mouse.x=e.clientX/innerWidth*14-7;mouse.y=-(e.clientY/innerHeight)*9+4.5},{passive:true});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);if(document.hidden)return;const t=clock.getElapsedTime(),pos=geo.attributes.position,alph=geo.attributes.alpha.array;for(let i=0;i<count;i++){const bx=base[i*3],by=base[i*3+1],dist=Math.hypot(bx-mouse.x,by-mouse.y);let target=dist<1.5?dist/1.5*.18:.72;target+=Math.sin(t*.3+i*.01)*.08;alph[i]+=(target-alph[i])*.08;pos.array[i*3]=bx+Math.sin(t*.2+i*.01)*.05;pos.array[i*3+1]=by+Math.cos(t*.15+i*.02)*.05}pos.needsUpdate=true;geo.attributes.alpha.needsUpdate=true;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});addEventListener('pagehide',()=>{geo.dispose();mat.dispose();renderer.dispose()});
</script></body></html>
